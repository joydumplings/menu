
<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-weith, initial-scale=1"  />
	<title>餃點時線上菜單Joy Dumplings' Menu</title>
	<link rel="stylesheet" type="text/css" href="style.css" media="all">
	<link rel="stylesheet" href="https://cloudflare.com">
	
	
<body>
	<img src="logopng.png" style="padding: 25px;padding-bottom: 0px;display: block;margin: 0 auto;max-width: 70%;height: auto;">
	<nav id="myNav">
		<ul>
			<li>
			  <a href="foodspage.html">正體中文</a>
			</li>
			<li>
			  <a href="index2.html">English</a>
			</li>
		  </ul>
	</nav>
	<h3>官方Line @joydumplings，如需大量訂購</h3>
	<p style="font-size:10px; margin:-27px; text-align:center;"></p>
	<div class="menu-container">
		<img class="menu-img" src="menu005.png" data-full="menu1.jpg" alt="線上菜單 1" loading="lazy">
	
		<div id="lightbox" class="lightbox" onclick="closeLightbox()">
		<!-- 關閉按鈕 -->
		<span class="close-btn">&times;</span>
		<!-- 放大後的圖片 (阻止冒泡，避免點擊圖片也觸發關閉) -->
		<img id="lightbox-img" class="lightbox-content" src="" onclick="event.stopPropagation()">
	</div>
  </div>
	
<script>

const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    // 監聽畫面上所有縮圖的點擊事件
    document.querySelectorAll('.menu-img').forEach(img => {
      img.addEventListener('click', function() {
        // 1. 取得大圖路徑
        const fullSrc = this.getAttribute('data-full');
        // 2. 將大圖路徑帶入燈箱的 img 標籤
        lightboxImg.src = fullSrc;
        // 3. 顯示燈箱 (改為 flex 可以完美置中)
        lightbox.style.display = 'flex';
      });
    });

    // 關閉燈箱的函式
    function closeLightbox() {
      lightbox.style.display = 'none';
      lightboxImg.src = ''; // 清空圖片路徑，釋放記憶體並避免下次開啟閃爍
    }




function myFunction() {
	document.getElementById("myInput").value = "";
	//document.getElementById("myInput").rows = 4;
	
	for (i = 0; i<39; i++){
		
		//var checkBox = document.querySelectorAll("input")[i];
		var checkBox = document.querySelectorAll('input[type="checkbox"]')[i];
		var num = document.querySelectorAll('input[type="text"]')[i].value;
		var add = document.getElementById("addtext").value;
		
		if (checkBox.checked == true){
			document.getElementById("myInput").value += checkBox.name;
			document.getElementById("myInput").value += num;
			document.getElementById("myInput").value += checkBox.value;
			document.getElementById("myInput").value += "\n";
			//if (i > 1){
			//	document.getElementById("myInput").rows += 1;
			//}
		} else { 
			//text.style.display = "none";
		}
		//document.getElementById("myInput").value += i;
	}
	document.getElementById("myInput").value += add;
	if (add != ''){
		document.getElementById("myInput").value += "\n";
	}
	document.getElementById("myInput").value += "\n感謝";
	
}
function selectall() {
	document.getElementById("myInput").select();
}
var input = document.getElementById("myInput");
input.addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    myFunction();
  }
});
</script>


</body>
</html>
